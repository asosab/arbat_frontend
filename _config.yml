# arbat — Escuela de Tiro con Arco
# Configuración Jekyll / GitHub Pages

title: "arbat — Escuela de Tiro con Arco"
description: >-
  Escuela de tiro con arco en Santa Cruz de la Sierra, Bolivia.
  Entrenamiento olímpico, recreativo, deportivo y competitivo para todos los niveles.
url: "https://asosab.github.io"   # TEMPORAL: sitio de prueba en GitHub Pages.
                                    # Cuando exista arbat.com.bo, volver a:
                                    #   url: "https://arbat.com.bo"
                                    #   baseurl: ""
baseurl: "/arbat_frontend"         # nombre del repo — GitHub Pages sirve el sitio
                                    # en esa subruta cuando no hay dominio propio
lang: es-BO
locale: es_BO
timezone: America/La_Paz

# Autor / entidad para jekyll-seo-tag
author:
  name: "arbat"
  email: "arbat.archery@gmail.com"
  twitter: "arbatArchery"   # sin @ — alimenta twitter:creator

# Logo para jekyll-seo-tag — se inyecta en el JSON-LD de Organization/WebSite
# que genera {% seo %} automáticamente. También se usa como og:image por
# defecto (ver `defaults` más abajo) para páginas sin foto propia — el logo
# NO alimenta og:image solo, hay que declararlo explícito ahí. Ruta relativa
# al root; Jekyll resuelve url + baseurl solo (y deja de agregar baseurl
# cuando se pase a arbat.com.bo).
logo: /assets/images/logo.png

# Twitter Cards — controla cómo se ve el link al compartirlo en Twitter/X.
# "summary_large_image" usa el `image` de cada página (o `logo` si la página
# no define uno) como imagen grande.
twitter:
  card: summary_large_image
  username: "arbatArchery"   # sin @ — alimenta twitter:site

# Social — alimenta el "sameAs" del JSON-LD de Organization que genera
# {% seo %} (más redes que el schema LocalBusiness manual de
# _includes/schema/local-business.html, que solo cubre Instagram por ahora).
social:
  name: "arbat"
  links:
    - "https://www.instagram.com/arbat.archery"

# ---------------------------------------------------------------------------
# Datos NAP y de marca — fuente única de verdad, reutilizable en layouts como
# {{ site.arbat.direccion }}, {{ site.arbat.lema }}, etc.
# ---------------------------------------------------------------------------
arbat:
  nombre: "arbat"
  lema: "Sentio ergo attingo"
  direccion: "Av. Roca y Coronado #1800, entre 4to y 5to anillo, Santa Cruz de la Sierra, Bolivia"
  latitud: -17.786213690725038
  longitud: -63.22014574535284
  google_maps_url: "https://maps.app.goo.gl/yrxjsFbNvWqtT6Bp9"
  telefono_whatsapp:
    - "+591 70885758"
    - "+591 76660577"
  email: "arbat.archery@gmail.com"
  instagram: "https://www.instagram.com/arbat.archery"
  horarios:
    - dias: "Lunes, miércoles y viernes"
      turnos: ["16:00", "18:00"]
      duracion: "2 horas"
    - dias: "Sábados"
      turnos: ["09:00–12:00", "14:30–17:00"]
  # Completar cuando estén creados en Google Calendar (ver plan, sección 3)
  google_calendar_citas_url: "https://calendar.app.google/RP52yPEfV1MfCF587"
  google_calendar_eventos_embed_url: "https://calendar.google.com/calendar/embed?src=arbat.archery%40gmail.com&ctz=America%2FLa_Paz"
  google_calendar_eventos_ics_url: "https://calendar.google.com/calendar/ical/arbat.archery%40gmail.com/public/basic.ics"

# ---------------------------------------------------------------------------
# Plugins — todos soportados nativamente por GitHub Pages (sin build custom)
# ---------------------------------------------------------------------------
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# ---------------------------------------------------------------------------
# Colecciones y permalinks (sección 2 del plan)
# ---------------------------------------------------------------------------
collections:
  instructores:
    output: true
    permalink: /instructores/:path/
  clases:
    output: true
    permalink: /clases/:path/
  eventos:
    output: true
    permalink: /eventos/:path/

# ---------------------------------------------------------------------------
# Defaults de front matter por tipo de contenido
# schema_type queda disponible en el layout para renderizar el JSON-LD correcto
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      schema_type: "Article"
      seo:
        type: "Article"

  - scope:
      path: ""
      type: "instructores"
    values:
      layout: "instructor"
      schema_type: "ProfilePage"
      seo:
        type: "ProfilePage"

  - scope:
      path: ""
      type: "clases"
    values:
      layout: "clase"
      schema_type: "Service"
      seo:
        type: "Service"

  - scope:
      path: ""
      type: "eventos"
    values:
      layout: "evento"
      schema_type: "Event"
      seo:
        type: "Event"
      # tier: "A" — solo eventos Tier A viven como colección (amistosas/regionales/nacionales)

  - scope:
      path: ""
    values:
      layout: "default"
      schema_type: "WebPage"
      image: /assets/images/logo.png

# ---------------------------------------------------------------------------
# Markdown y build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

permalink: pretty
future: false
show_drafts: false

# ---------------------------------------------------------------------------
# Excluir del build
# ---------------------------------------------------------------------------
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - scripts/
  - "*.gemspec"
  - assets/images/README.md

# ---------------------------------------------------------------------------
# Facebook Login (SDK JS) — usado por _includes/facebook-sdk.html y
# assets/js/user.js. app_id no es secreto, puede vivir en el repo.
# También alimenta el meta tag fb:app_id en head.html (ver ese archivo) —
# mismo App ID, no hace falta crear una app separada para eso.
# ---------------------------------------------------------------------------
facebook:
  app_id: "1662744362522934"
  api_version: "v26.0"
