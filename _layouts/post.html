<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-BO' }}">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
<main>
{% include breadcrumbs.html %}
<article class="post">
  <h1>{{ page.title }}</h1>
  {% if page.date %}
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d/%m/%Y' }}</time>
  {% endif %}
  {{ content }}
</article>
</main>
{% include footer.html %}
{% include schema/article.html %}
</body>
</html>
