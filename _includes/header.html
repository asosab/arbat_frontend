<header class="site-header">
  <div class="header-fila wrap">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="{{ site.arbat.nombre }}">
      <span class="site-logo-texto">{{ site.arbat.nombre }}</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
      <a href="{{ '/clases/principiantes/' | relative_url }}">Clases</a>
      <a href="{{ '/precios/' | relative_url }}">Precios</a>
      <a href="{{ '/horarios/' | relative_url }}">Horarios</a>
      <a href="{{ '/instructores/raul-suarez/' | relative_url }}">Instructores</a>
      <a href="{{ '/ubicacion/' | relative_url }}">Ubicación</a>
      <a class="nav-cta-reservar" href="{{ '/reservar/' | relative_url }}">Reservar</a>
    </nav>

    <div class="nav-user" id="nav-user">
      <button class="nav-cta nav-cta--login" id="btn-fb-login" type="button">
        Ingresar con Facebook
      </button>
      <div class="nav-user-logged" id="nav-user-logged" hidden>
        <span class="nav-user-nombre" id="nav-user-nombre"></span>
        <img class="nav-user-avatar" id="nav-user-avatar" src="" alt="">
      </div>
    </div>

    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
