<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy — Mock User + ArcherySchool</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 18px 24px; background: white; border-bottom: 1px solid #ddd; }
    header h1 { margin: 0 0 6px; font-size: 22px; }
    header p { margin: 0; color: #666; }
    nav { display: flex; gap: 8px; padding: 14px 24px; background: white; border-bottom: 1px solid #ddd; }
    nav button { border: 1px solid #ccc; background: white; border-radius: 8px; padding: 9px 14px; cursor: pointer; font: inherit; }
    nav button.active { background: #eee; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .panel { display: none; background: white; border: 1px solid #ddd; border-radius: 14px; padding: 22px; min-height: 300px; }
    .panel.active { display: block; }
    .status { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; background: #f1f1f1; font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .actions button { border: 1px solid #bbb; background: white; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
    #buddy-user-target, #buddy-school-target { margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Buddy — entorno Mock</h1>
    <p>Prueba visual de User y ArcherySchool sin Auth ni backend.</p>
  </header>
  <nav>
    <button id="tab-user" class="active" type="button">User</button>
    <button id="tab-school" type="button">ArcherySchool</button>
  </nav>
  <main>
    <section id="panel-user" class="panel active">
      <div class="status">User mock activo. Los cambios se guardan localmente en este navegador.</div>
      <div class="actions">
        <button id="user-profile" type="button">Mostrar perfil completo</button>
        <button id="user-onboarding" type="button">Probar formulario de onboarding</button>
        <button id="user-reset" type="button">Restablecer datos mock</button>
      </div>
      <div id="buddy-user-target"></div>
    </section>
    <section id="panel-school" class="panel">
      <div class="status">ArcherySchool mock activo. No realiza peticiones al backend.</div>
      <div class="actions">
        <button id="school-student" type="button">Vista estudiante</button>
        <button id="school-admin" type="button">Vista administración</button>
        <button id="school-reset" type="button">Restablecer datos mock</button>
      </div>
      <div id="buddy-school-target"></div>
    </section>
  </main>

  <script>
    // Este entorno deliberadamente no carga auth, chat ni otros módulos que
    // puedan realizar llamadas externas. User y ArcherySchool trabajan con mock.
    window.BuddyConfig = {
      debug: true,
      debugMode: true,
      app: { siteId: 'arbat' },
      modules: ['telemetry', 'user', 'archerySchool']
    };
  </script>
  <script src="config.js?v=mock" defer></script>
  <script src="buddy.js?v=mock" defer></script>
  <script>
    window.addEventListener('buddy:ready', function () {
      var userTarget = document.getElementById('buddy-user-target');
      var schoolTarget = document.getElementById('buddy-school-target');
      var user = window.Buddy.user;
      var school = window.Buddy.archerySchool;

      document.getElementById('user-profile').onclick = function () {
        user.renderProfile(userTarget);
      };
      document.getElementById('user-onboarding').onclick = function () {
        user.requestProfileCompletion();
      };
      document.getElementById('user-reset').onclick = function () {
        user.mock.reset();
        user.renderProfile(userTarget);
      };
      document.getElementById('school-student').onclick = function () {
        school.renderStudent(schoolTarget);
      };
      document.getElementById('school-admin').onclick = function () {
        school.renderAdmin(schoolTarget);
      };
      document.getElementById('school-reset').onclick = function () {
        school.mock.reset();
        school.renderStudent(schoolTarget);
      };

      user.renderProfile(userTarget);
    });

    function tab(buttonId, panelId, otherButtonId, otherPanelId) {
      document.getElementById(buttonId).onclick = function () {
        document.getElementById(buttonId).classList.add('active');
        document.getElementById(otherButtonId).classList.remove('active');
        document.getElementById(panelId).classList.add('active');
        document.getElementById(otherPanelId).classList.remove('active');
      };
    }
    tab('tab-user', 'panel-user', 'tab-school', 'panel-school');
    tab('tab-school', 'panel-school', 'tab-user', 'panel-user');
  </script>
</body>
</html>
